name: OnlyFights
options:
  bundleIdPrefix: com.onlyfights
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    PRODUCT_BUNDLE_IDENTIFIER: com.onlyfights.app
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  OnlyFights:
    type: application
    platform: iOS
    sources:
      - path: OnlyFights
    info:
      path: OnlyFights/Info.plist
    entitlements:
      path: OnlyFights/OnlyFights.entitlements
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        INSTAGRAM_APP_ID: ''
        DEVELOPMENT_TEAM: ''
